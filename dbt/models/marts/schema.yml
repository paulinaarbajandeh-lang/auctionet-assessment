version: 2

models:
  - name: fct_auction_items
    description: "Gold table tracking metrics, bid boundaries, and core transaction flags for every auction item."
    columns:
      - name: item_id
        description: "Foreign key referencing dim_items."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_items')
                field: item_id
      - name: company_id
        description: "Foreign key referencing dim_companies."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_companies')
                field: company_id

  - name: dim_items
    description: "Gold dimensional data describing descriptive texts, conditions, and titles for each auction entry."
    columns:
      - name: item_id
        description: "Primary identity key for items."
        data_tests:
          - unique
          - not_null

  - name: dim_companies
    description: "Gold dimensional details isolating structural traits regarding individual companies and locations."
    columns:
      - name: company_id
        description: "Primary identity key for companies."
        data_tests:
          - unique
          - not_null